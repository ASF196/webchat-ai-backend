databases:
  - name: webchat-ai-db
    databaseName: webchat_ai
    user: webchat_ai
    plan: free

services:
  - type: web
    name: webchat-ai-backend
    runtime: node
    plan: free
    # npm ci (not npm install) installs EXACTLY what's in package-lock.json —
    # no drift. This matters here specifically because of a real failure:
    # playwright was pinned as "^1.47.0", so a later build could resolve a
    # newer 1.x release than the one Render's browser-binary cache was
    # populated for. Playwright's browser downloads are keyed to the exact
    # package version, so a version bump without a matching fresh browser
    # download throws "Executable doesn't exist at .../chromium_headless_shell-.../"
    # — playwright.js is now pinned to an exact version for the same reason.
    # --with-deps also installs the OS-level shared libraries Chromium needs
    # to actually launch on a minimal Linux image, which a bare
    # `playwright install chromium` (browser binary only) does not.
    buildCommand: npm ci && npx playwright install --with-deps chromium
    startCommand: node server.js
    envVars:
      # Render wires this automatically from the database above — no need to
      # copy/paste a connection string anywhere.
      - key: DATABASE_URL
        fromDatabase:
          name: webchat-ai-db
          property: connectionString
      # sync:false means Render will prompt you to type these in during the
      # first deploy, rather than storing the real values in this file (so
      # you can safely commit render.yaml to a public repo).
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
